name: Framework verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: JVM tests and demo without Android
        run: ./gradlew -Pandroid=false -PvelaJavaVersion=${{ matrix.java }} test :app:run --no-daemon --no-configuration-cache

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
            ./gradlew -Pandroid=true :vela-android:connectedDebugAndroidTest :showcase-android:connectedDebugAndroidTest :vela-android:lintDebug :vela-devtools-android:lintDebug :showcase-android:lintDebug :showcase-android:assembleDebug :vela-cli:installDist --no-daemon --no-configuration-cache
            python3 tools/verify_dev_workflow.py --cli vela-cli/build/install/vela/bin/vela --work-dir "$RUNNER_TEMP/vela-workflow" --device emulator-5554
            python3 tools/benchmark_builds.py --project "$RUNNER_TEMP/vela-workflow/project with spaces" --cli vela-cli/build/install/vela/bin/vela --device emulator-5554 --output "$RUNNER_TEMP/vela-workflow/build-times.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results-${{ matrix.api }}
          path: |
            **/build/reports/androidTests/
            **/build/reports/lint-results-debug.*
            ${{ runner.temp }}/vela-workflow/dev.log
            ${{ runner.temp }}/vela-workflow/results.json
            ${{ runner.temp }}/vela-workflow/build-times.*
      - uses: actions/upload-artifact@v4
        if: matrix.api == 35
        with:
          name: framework-repository
          path: build/repository/

  distribution:
    needs: android
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: framework-repository
          path: build/repository/
      - name: Build platform runtime archive and test portable tooling
        run: ./gradlew -Pandroid=false test :vela-cli:runtimeDist --no-daemon --no-configuration-cache
      - name: Verify archive without system Java
        run: python tools/verify_distribution.py --archive "$(find vela-cli/build/distributions -name 'vela-0.1.0-*.zip' | head -1)" --work-dir "$RUNNER_TEMP/vela-archive-test"
      - uses: actions/upload-artifact@v4
        with:
          name: vela-${{ matrix.os }}
          path: vela-cli/build/distributions/vela-0.1.0-*.zip
