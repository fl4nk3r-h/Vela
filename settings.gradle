pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Vela'
include('app')
include('vela-core')
include('vela-compiler')
include('vela-tooling', 'vela-gradle-plugin', 'vela-cli', 'vela-dev-protocol')
// JVM verification must work without resolving Android plugins or locating an SDK.
def sdkPath = providers.environmentVariable('ANDROID_HOME')
        .orElse(providers.environmentVariable('ANDROID_SDK_ROOT')).orElse('').get()
def hasSdk = !sdkPath.isBlank() && file(sdkPath).isDirectory()
def androidEnabled = providers.gradleProperty('android').map { it.toBoolean() }.orElse(hasSdk).get()
if (androidEnabled) {
    include('vela-android')
    include('showcase-android')
    include('vela-devtools-android')
}
