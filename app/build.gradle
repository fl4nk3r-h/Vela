plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('velaJavaVersion').getOrElse('25').toInteger())
    }
}

dependencies {
    implementation project(':vela-core')

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.vela.app.App'
}
